name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$TAG" =~ ^v0\.[0-9]{8}\.[1-9][0-9]*$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish tagged package
        shell: bash
        run: |
          set -euo pipefail
          version=${TAG#v}
          test "$(node -p "require('./package.json').version")" = "$version"
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@botcomm%2fsdk/$version")
          case "$status" in
            200) echo "@botcomm/sdk@$version is already published"; exit 0 ;;
            404) ;;
            *) echo "npm registry lookup returned HTTP $status" >&2; exit 1 ;;
          esac
          npm install --global npm@11
          npm publish --ignore-scripts --access public --registry=https://registry.npmjs.org
